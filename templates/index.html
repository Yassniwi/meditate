<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YogaGuru Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #f3e5f5);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #43a047, #7e57c2);
      color: #ffffff;
      padding: 18px 22px;
    }

    .chat-header h1 { font-size: 1.25rem; }
    .chat-header p { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fafafa;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #43a047;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      align-self: flex-start;
      background: #ede7f6;
      color: #2d2d2d;
      border-bottom-left-radius: 4px;
    }

    .message.error {
      align-self: flex-start;
      background: #ffebee;
      color: #c62828;
    }

    .typing { font-style: italic; color: #666666; }

    .chat-input {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #eeeeee;
      background: #ffffff;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #cccccc;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input input:focus { border-color: #7e57c2; }

    .chat-input button {
      padding: 0 22px;
      border: none;
      border-radius: 24px;
      background: #7e57c2;
      color: #ffffff;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .chat-input button:hover { background: #6a45b0; }
    .chat-input button:disabled { background: #b39ddb; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>🧘 YogaGuru</h1>
      <p>Ask me anything about yoga</p>
    </div>

    <div class="chat-messages" id="messages">
      <div class="message bot">Namaste! I'm YogaGuru. Ask me about yoga poses, breathing techniques, meditation, philosophy, or any yoga topic you're studying.</div>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your yoga question..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const history = [];

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message) return;

      addMessage(message, "user");
      inputEl.value = "";
      sendBtn.disabled = true;

      const typing = addMessage("Thinking...", "bot typing");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          addMessage(data.error || "Something went wrong.", "error");
        } else {
          addMessage(data.reply, "bot");
          history.push({ role: "user", text: message });
          history.push({ role: "model", text: data.reply });
        }
      } catch (err) {
        typing.remove();
        addMessage("Unable to reach the server. Please try again.", "error");
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
